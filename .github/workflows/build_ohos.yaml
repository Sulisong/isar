name: Build OHOS Binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.1.0), leave empty to skip release upload"
        required: false
      ohos_sdk_version:
        description: "OpenHarmony SDK version"
        default: "6.0"
        required: false

env:
  OHOS_SDK_VERSION: ${{ github.event.inputs.ohos_sdk_version || '6.0' }}

jobs:
  build:
    name: Build OHOS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-unknown-linux-ohos
            artifact_name: arm64-v8a
          - arch: x86_64
            rust_target: x86_64-unknown-linux-ohos
            artifact_name: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup OpenHarmony SDK
        id: setup-sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          components: native

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake

      - name: Build
        run: bash tool/build_ohos.sh ${{ matrix.arch }}
        env:
          OHOS_NDK_HOME: ${{ steps.setup-sdk.outputs.ohos_sdk_native }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libisar_ohos_${{ matrix.artifact_name }}
          path: libisar_ohos_*.so

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        if: github.event.inputs.tag != ''
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: libisar_ohos_${{ matrix.artifact_name }}.so
          asset_name: libisar_ohos_${{ matrix.artifact_name }}.so
          tag: ${{ github.event.inputs.tag }}
